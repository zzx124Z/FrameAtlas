[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-contact-sheet"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["opencv-python>=4.10", "Pillow>=10.0"]

[project.scripts]
video-contact-sheet = "video_contact_sheet.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
